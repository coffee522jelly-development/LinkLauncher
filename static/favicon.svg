<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="rainbow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF0000;stop-opacity:1" />
      <stop offset="20%" style="stop-color:#FF7F00;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#FFFF00;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#00FF00;stop-opacity:1" />
      <stop offset="80%" style="stop-color:#0000FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B00FF;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" />
      <feOffset dx="4" dy="4" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Inner Fill (Gray) -->
  <circle cx="256" cy="256" r="185" fill="#666" filter="url(#shadow)" />
  <!-- Main Ring (Rainbow) -->
  <circle cx="256" cy="256" r="200" stroke="url(#rainbow)" stroke-width="30" fill="none" />
  <!-- White 'L' -->
  <path d="M210 150 V340 H310" stroke="white" stroke-width="35" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)" />
</svg>